about_content: | # this will include new lines to allow paragraphs
  Hi, I’m Sergei, a Senior Quality Assurance Engineer on the SIEM team at BI.ZONE. I automate frontend and backend testing, primarily with Python, and also work with JavaScript and Java.

  From September 2020 to May 2026, I also mentored QA students at SkillFactory.

  My specialties: <mark>testing</mark> and <mark>eating pizza</mark>.

  I also share what I learn on [Medium](https://medium.com/@rudikqa).

